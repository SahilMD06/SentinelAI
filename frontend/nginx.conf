# Static SPA + same-origin API proxy. The backend service name ("backend")
# resolves via Docker Compose's internal DNS — nothing here is
# environment-specific beyond that hostname.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /health { proxy_pass http://backend:8000/health; }
    location = /readiness { proxy_pass http://backend:8000/readiness; }
    location = /liveness { proxy_pass http://backend:8000/liveness; }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Client-side routing — every unmatched path falls back to index.html so
    # react-router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
